server:
  port: 8080

spring:
  application:
    name: enterprise-data-agent
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Agent service configuration
agent:
  service-url: ${AGENT_SERVICE_URL:http://localhost:8001}
  timeout-seconds: ${AGENT_TIMEOUT_SECONDS:120}
  max-retries: ${AGENT_MAX_RETRIES:2}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.enterprise.agent: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO
    org.springframework.data.redis: INFO
